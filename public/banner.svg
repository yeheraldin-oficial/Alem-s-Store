<text x="80" y="180" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#5A4A6B">Ropa que crece</text>
<text x="80" y="240" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#FF8DA1">contigo</text>
<text x="80" y="290" font-family="Arial, sans-serif" font-size="20" fill="#5A4A6B" opacity="0.8">Algodón orgánico · Hipoalergénico · Hecho con amor</text>
