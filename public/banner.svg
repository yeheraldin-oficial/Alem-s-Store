<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
<defs>
<linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FFD8E0"/>
<stop offset="0.5" stop-color="#D9EEFB"/>
<stop offset="1" stop-color="#E5D9F2"/>
</linearGradient>
<linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0.6"/>
</linearGradient>
</defs>
<rect width="1200" height="480" fill="url(#bgGrad)"/>
