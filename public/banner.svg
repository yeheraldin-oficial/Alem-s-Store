<text x="200" y="366" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ver catálogo</text>
<!-- Lado derecho: tarjeta de producto destacado -->
<g transform="translate(820,140)">
<rect x="-110" y="-30" width="220" height="280" rx="20" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="3"/>
