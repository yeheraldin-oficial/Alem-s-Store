</g>
</g>
<text x="0" y="220" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#5A4A6B" text-anchor="middle">Body bebé orgánico</text>
<text x="0" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FF8DA1" text-anchor="middle">S/ 35.00</text>
</g>
