<path d="M -45 -55 L 45 -55 L 45 -25 L 58 0 L 50 20 L 35 8 L 35 75 L -35 75 L -35 8 L -50 20 L -58 0 L -45 -25 Z" fill="#FFB6C1" stroke="#5A4A6B" stroke-width="2.5" stroke-linejoin="round"/>
